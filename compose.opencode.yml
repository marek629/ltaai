x-common: &opencode
  volumes:
    - .:/home/ubuntu/workspace:Z
    - ${HOME}/${CLIDIR}:/root/${CLIDIR}:Z
    - ${HOME}/.kiro:/root/.kiro:Z
  working_dir: /home/ubuntu/workspace
  stdin_open: true
  tty: true
  user: root
  pull_policy: missing

services:
  # doctor:
  #   extends: yarn
  #   command: ["doctor", "--all"]
  # login:
  #   extends: yarn
  #   command: ["login", "--use-device-flow"]

  catch2:
    <<: *opencode
    build:
      context: .
      args:
        target: catch2
    image: ghcr.io/marek629/opencode:catch2
    command: ["--agent", "c++-developer"]


  pytest:
    <<: *opencode
    build:
      context: .
      args:
        target: pytest
    image: ghcr.io/marek629/opencode:pytest

  yarn:
    <<: *opencode
    build:
      context: .
      args:
        target: yarn
    image: ghcr.io/marek629/opencode:yarn
    # command: ["--agent", "js-developer"]
